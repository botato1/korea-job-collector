# career-ops config/plugins.yml 에 추가할 블록 예시.
# 비밀 값(API 키)은 여기 말고 career-ops/.env 에 넣는다.

plugins:
  saramin:
    enabled: true

    # 키워드마다 따로 검색한다 (한 키워드 안의 여러 단어는 AND로 처리될 수 있음).
    keywords:
      - "AI"
      - "LLM"
      - "머신러닝"
      - "백엔드"
      - "서버 개발"
      - "Python"
      - "시험자동화"
      - "임베디드"
      - "인프라"
      - "DevOps"

    # 근무지역 코드 (사람인 코드표 code-table2). 비우면 전국.
    # 서울 전체, 성남(분당·수정·중원 포함), 용인 기흥·수지, 수원, 의왕, 안양, 과천, 군포, 광명, 부천
    loc_cd: [101000, 102180, 102410, 102420, 102220, 102440, 102320, 102060, 102100, 102070, 102140]

    # 경력 코드: 1 신입, 3 신입·경력, 0 경력무관 (2 경력은 제외)
    experience: [1, 3, 0]

    count: 110                 # 한 번에 받을 공고 수 (최대 110)
    max_pages_per_keyword: 5   # 키워드당 최대 페이지 수
    daily_call_budget: 300     # 하루 호출 상한 (API 한도 500)
    published_days: 7          # 최근 N일 안에 등록된 공고만 (0이면 제한 없음)
    exclude_headhunting: true  # 헤드헌팅·파견업체 공고 제외
